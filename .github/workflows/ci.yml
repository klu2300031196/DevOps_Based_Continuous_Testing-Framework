
name: Continuous Testing Pipeline

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  build-test-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Build application
        run: mvn --batch-mode clean package -DskipTests

      - name: Start application
        run: |
          nohup java -jar target/continuous-testing-framework-1.0.0.jar --server.port=8081 > app.log 2>&1 &
          echo $! > app.pid

      - name: Wait for application health
        run: |
          for i in {1..30}; do
            if curl --fail http://localhost:8081/api/health; then
              echo "Application is ready"
              exit 0
            fi
            sleep 2
          done
          cat app.log
          exit 1

      - name: Build and run automated tests
        run: mvn --batch-mode test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-reports
          path: target/surefire-reports/
          if-no-files-found: warn

      - name: Build Docker image
        run: docker build --tag continuous-testing-framework:${{ github.sha }} .

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag continuous-testing-framework:${{ github.sha }} ghcr.io/klu2300031196/devops-based-continuous-testing-framework:latest
          docker tag continuous-testing-framework:${{ github.sha }} ghcr.io/klu2300031196/devops-based-continuous-testing-framework:${{ github.sha }}

      - name: Push Docker image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ghcr.io/klu2300031196/devops-based-continuous-testing-framework:latest
          docker push ghcr.io/klu2300031196/devops-based-continuous-testing-framework:${{ github.sha }}

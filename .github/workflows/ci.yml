name: Continuous Testing Pipeline

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  build-test-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and run automated tests
        run: mvn --batch-mode clean verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-reports
          path: target/surefire-reports/
          if-no-files-found: warn

      - name: Build application package
        run: mvn --batch-mode package -DskipTests

      - name: Build Docker image
        run: docker build --tag continuous-testing-framework:${{ github.sha }} .

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag continuous-testing-framework:${{ github.sha }} ghcr.io/klu2300031196/devops-based-continuous-testing-framework:latest
          docker tag continuous-testing-framework:${{ github.sha }} ghcr.io/klu2300031196/devops-based-continuous-testing-framework:${{ github.sha }}

      - name: Push Docker image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ghcr.io/klu2300031196/devops-based-continuous-testing-framework:latest
          docker push ghcr.io/klu2300031196/devops-based-continuous-testing-framework:${{ github.sha }}